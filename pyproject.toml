[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ntl-pact18"
version = "0.1.0"
description = "Prompt-Aware Constrained aTtribution (PACT-18) for 18-way LLM authorship attribution"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "ntl-pact18" }]
dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
    "scipy>=1.9",
    "scikit-learn>=1.2",
    "PyYAML>=6.0",
    "joblib>=1.2",
    "pyarrow>=15",
]

[project.optional-dependencies]
boost = ["lightgbm>=4.0"]
gpu = [
    "torch>=2.3",
    "transformers>=4.45",
    "peft>=0.13",
    "accelerate>=0.34",
    "bitsandbytes>=0.45",
    "xgboost>=2.0",
]
dev = ["pytest>=7.0"]

[project.scripts]
ntl-pact18 = "ntl_pact18.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
