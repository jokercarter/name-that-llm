# Two-stage LoRA (public 0.59x recipe) on 2x T4.
#
# What changed versus kaggle_8h_50k_3fold.yaml
# ---------------------------------------------
# 1. The pool is no longer mixed into the training file. Stage 1 trains on the
#    external passages only (1 epoch, the public recipe), stage 2 fine-tunes on
#    the 2,699 host passages only (2 epochs). Mixing them back hurts.
# 2. The trunk is truncated to the first 24 of 36 blocks. Style lives in the
#    early/middle layers; the last blocks encode topic and the test prompts are
#    unseen, so they cost ~33% of the compute and buy nothing.
# 3. Pooling is per-layer LayerNorm + masked mean, 8 depths concatenated, with
#    two linear heads: plain and centred. The centred head is trained on
#    triplet-centred features (three models answering the same prompt).
#
# Budget (measured 0.216 s/sample-pass on the 1.7B trunk at 28 layers; the 8B
# trunk keeps 24/36 layers and is ~4.0x wider per layer, so expect ~0.6-0.7
# s/sample on 2x T4 - the smoke kernel measures the exact number):
#   stage 1: <=13k triplet rows x 1 epoch ~ 2.4 h (cap + budget agree)
#   stage 2: 3 folds x ~1.0 h + refit ~1.0 h ~ 4.0 h
#   classical ~1.0 h, assemble ~0.2 h  ->  total ~7.6 h
# The per-fit caps below only bind if the card is slower than measured.

project:
  seed: 42

paths:
  data_dir: /kaggle/input/competitions/name-that-llm
  artifacts_dir: /kaggle/working/artifacts

device:
  preference: cuda
  require_gpu: true

parallel:
  gpus: 2
  master_port: 29513

data:
  n_folds: 3

# n-gram / stylometry members see host + pool; 0 means "all rows"
classical:
  max_fit_rows: 0

features:
  stylegram:
    enabled: true
    C: 0.5
    center_mode: replace
  stylometry:
    enabled: true
    backend: auto
    n_estimators: 400
    learning_rate: 0.04
    max_leaf_nodes: 15
  ngram_lm:
    enabled: true
    order: 2
    alpha: 0.1
  linear_baseline:
    enabled: true
    C: 2.0
  torch_linear:
    enabled: false

  qwen:
    enabled: true
    mode: two_stage
    model_id: Qwen/Qwen3-8B-Base      # replaced by the mounted path at run time
    max_len: 384
    batch_size: 16                    # prediction batch (triplets set training)
    triplet_batch: 3                  # triplets per rank per step -> 6 global
    grad_accum: 2
    truncate_layers: 24
    layers: [2, 4, 6, 8, 12, 16, 20, 24]
    pool_mode: mean_concat
    lora_r: 16
    lora_alpha: 32
    lora_dropout: 0.05
    target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
    stage1_epochs: 1
    stage1_lr: 0.0001
    stage2_epochs: 2
    stage2_lr: 0.00005
    head_lr: 0.001
    stage2_head_lr: 0.0005
    centred_weight: 1.0
    label_smoothing: 0.0
    supcon_weight: 0.0
    warmup_ratio: 0.05
    weight_decay: 0.01
    grad_checkpoint: true
    load_in_4bit: true
    compute_dtype: auto
    skip_lm_head: true
    length_bucket: false
    distributed: true
    reset_before_fit: false
    val_fraction: 0.0
    log_every: 50
    stage1_time_budget_hours: 2.4
    stage1_max_rows: 13000          # stratified by label; 0 = every pool row
    stage1_class_weighted: true     # inverse-frequency CE, capped at 3x
    time_budget_hours: 1.0

calibration:
  temperature: true
  em_prior: false

blend:
  l2: 1.0
  max_iter: 400

clustering:
  method: tfidf
  threshold: 0.90
  min_size: 2
  max_size: 18

# The hidden test holds ~2-3 passages per prompt (LB probe), so a hard
# one-per-class capacity constraint has almost nothing to constrain. Keep PRISM
# only for clusters of 4+ and soften lambda.
prism:
  enabled: true
  mode: relaxed
  lam: 0.5
  min_size: 4
  max_size: 18

experts:
  enabled: false

shield:
  enabled: true
  penalty: 2.5
  max_rate: 0.01
  min_support: 60
