# 8-hour profile, rebuilt from the measured T4 throughput.
#
# Measurement (kaggle kernels jokercarter/ntl-pact18-verify-run):
#   refit: 90 optimizer steps x 32 samples = 2,880 sample-passes in 623 s
#   -> 0.216 s per sample-pass across both cards  (~4.6 samples/s)
#   -> 0.43 s per sample on ONE card, i.e. MFU ~0.055 for a 1.7B model at
#      ~150 padded tokens with 4-bit weights and gradient checkpointing.
#   peak 7.5 GiB / 14.6 GiB at batch 8 per card.
#
# Budget arithmetic (passes = rows x folds; the refit adds one more copy):
#   50,003 x 3 = 150,009 passes x 0.216 s = 9.0 h   <- does NOT fit 9 h
#   50,003 x 2 = 100,006 passes            = 6.0 h
#   so batch goes 8 -> 12 per card (global 72) to buy ~10-15% MFU back,
#   which puts 3 folds at ~7.8-8.2 h. The wall-clock guard (--deadline-hours
#   8.8) trims the refit if the card turns out slower than that.
#
# If you would rather be deterministic than fast: keep batch 8 and drop to
# 2 folds (6.0 h of QLoRA, ~7.0 h total).
#
# 4B is not an option: 2.35x the FLOPs puts 3 folds at ~21 h.

project:
  seed: 42

paths:
  data_dir: /kaggle/input/competitions/name-that-llm
  artifacts_dir: /kaggle/working/artifacts

device:
  preference: cuda
  require_gpu: true

parallel:
  gpus: 2
  master_port: 29511

data:
  n_folds: 3

# the CPU members train on a stratified 12k subset (all competition rows kept);
# fitting them on 50k costs ~1 h and buys nothing, the blend is fitted on the
# 2,303 competition rows anyway
classical:
  max_fit_rows: 12000

features:
  stylegram:
    enabled: true
    C: 0.5
    center_mode: replace
  stylometry:
    enabled: true
    backend: auto
    n_estimators: 400
    learning_rate: 0.04
    max_leaf_nodes: 15
  ngram_lm:
    enabled: true
    order: 2
    alpha: 0.1
  linear_baseline:
    enabled: true
    C: 2.0
  torch_linear:
    enabled: false

  qwen:
    enabled: true
    mode: qlora
    model_id: Qwen/Qwen3-1.7B
    max_len: 384
    batch_size: 12        # 12 x 2 cards x accum 2 = global 72
    grad_accum: 2
    layers: [2, 5, 8, 12, 16, 20, 24, 28]
    head_proj: 768
    head_dropout: 0.10
    lr: 0.0001
    epochs: 1
    lora_r: 32
    lora_alpha: 64
    lora_dropout: 0.10
    target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
    grad_checkpoint: true
    warmup_ratio: 0.03
    weight_decay: 0.05
    supcon_weight: 0.05
    label_smoothing: 0.10
    load_in_4bit: true
    compute_dtype: auto
    skip_lm_head: true
    length_bucket: true
    bucket_pool: 40
    distributed: true
    reset_before_fit: true
    # per-fit cap: a fold needs ~2.0 h, the refit ~2.7 h. Only binds when the
    # card is slower than measured, and then it truncates instead of dying.
    time_budget_hours: 2.9
    val_fraction: 0.15
    early_stop_patience: 2
    eval_every: 200
    log_every: 20

calibration:
  temperature: true
  em_prior: false

blend:
  l2: 1.0
  max_iter: 400

clustering:
  method: tfidf
  threshold: 0.90
  min_size: 2
  max_size: 18

prism:
  enabled: true
  mode: relaxed
  lam: 2.0
  min_size: 2
  max_size: 18

experts:
  enabled: true
  adaptive_rho: true
  min_rows: 100

shield:
  enabled: true
  penalty: 2.5
  max_rate: 0.01
  min_support: 100
